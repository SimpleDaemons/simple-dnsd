version: '3.8'

services:
  simple-dnsd:
    image: simple-dnsd:latest
    container_name: simple-dnsd
    ports:
      - "67:67/tcp"
    volumes:
      - ./config:/etc/simple-dnsd:ro
      - ./data:/var/lib/simple-dnsd
      - ./logs:/var/log/simple-dnsd
    environment:
      - SIMPLE-DNSD_CONFIG=/etc/simple-dnsd/simple-dnsd.conf
      - SIMPLE-DNSD_LOG_LEVEL=info
      - SIMPLE-DNSD_BIND_ADDRESS=0.0.0.0
      - SIMPLE-DNSD_BIND_PORT=67
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "67"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - simple-dnsd-network

networks:
  simple-dnsd-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
